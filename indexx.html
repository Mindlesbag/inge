<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CallesYa</title>
  <link rel="stylesheet" href="css index.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('fondo1.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-ind {
      align-items: center;
      margin-top: 300px;
      justify-content: center;
      padding: 20px;
      background-color: rgba(54, 44, 146, 0.8);
      border: none;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      display: grid;
    grid-template-columns: repeat(2,300px);
      gap: 30px;
      width: 35%;
     
    }

    
    .sidebar-ind button {
      display: block;
      width: 280px;
      height: 150px;
      margin: 15px ;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background-color: #3b60b1;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    .sidebar-ind button:hover {
      background-color: #042b66;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <a href="indexx.html">
      <img src="intendencia logo.png" alt="Intendencia de Soriano">
    </a>
  </div>
</header>

<main>

  <div class="sidebar-ind">
    <button onclick="window.location.href='denuncia.html'">Denuncia Anónima</button>
    <button onclick="window.location.href='registro.html'">Registro</button>
    <button onclick="window.location.href='InicioS.html'">Iniciar Sesión</button>
    <button onclick="window.location.href='planvereda.html'">Plan Vereda</button>
  </div>
</main>

</body>
</html>
