<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio de Sesión</title>
</head>
<body>

  <form id="loginForm" action="login.php" method="post">
    <label for="Cedula">Cédula:</label>
    <input type="text" id="Cedula" name="cedula" placeholder="Escriba su cédula..." required>

    <label for="Contrasena">Contraseña:</label>
    <input type="password" id="Contrasena" name="contrasena" placeholder="Ingrese su contraseña..." required>

    <button type="submit">Iniciar Sesión</button>
  </form>

  <script>
    // Función para convertir ArrayBuffer a hex
    function bufferToHex(buffer) {
      return Array.from(new Uint8Array(buffer))
                  .map(b => b.toString(16).padStart(2, '0'))
                  .join('');
    }

    // Función para calcular SHA-256
    async function sha256Hex(text) {
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return bufferToHex(hashBuffer);
    }

    // Evento antes de enviar el formulario
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
      event.preventDefault(); // Evita el envío inmediato

      const passInput = document.getElementById('Contrasena');
      const hash = await sha256Hex(passInput.value);

      passInput.value = hash; // Reemplaza la contraseña por su hash

      this.submit(); // Envía el formulario con la contraseña ya encriptada
    });
  </script>

</body>
</html>
